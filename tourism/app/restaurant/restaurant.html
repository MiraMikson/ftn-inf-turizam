<!doctype html>
<html lang="sr-Latn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restorani | TourApp</title>
    <link rel="stylesheet" href="../../dist/styles.css" />
    <link rel="stylesheet" href="../../dist/restaurant/restaurant.css" />
    <script src="restaurant.js" defer></script>
  </head>
  <body>
    <nav class="navbar">
      <h1 class="title">TourApp</h1>
      <ul class="nav-links">
        <li><a href="../index.html">Početna</a></li>
        <li><a href="../contact/contact.html">Kontakt</a></li>
        <li><a href="../tour/tour.html">Ture</a></li>
        <li><a href="restaurant.html" aria-current="page">Restorani</a></li>
      </ul>
    </nav>

    <main>
      <section
        class="restaurants"
        id="restorani"
        aria-labelledby="restaurants-title"
      >
        <h2 id="restaurants-title">Pregled restorana</h2>
        <p class="restaurants-hint">
          Kliknite na restoran da pogledate tipove kuhinje.
        </p>
        <table class="restaurant-table">
          <thead>
            <tr>
              <th scope="col">Naziv</th>
              <th scope="col">Kuhinja</th>
            </tr>
          </thead>
          <tbody id="restaurant-list"></tbody>
        </table>
        <div id="restaurant-details" hidden></div>
      </section>
    </main>
  </body>
</html>
