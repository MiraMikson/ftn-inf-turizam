<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="tours.css">
        <link rel="stylesheet" href="../../dist/styles.css">
    </head>
    <body>
        <nav class="navbar">
            <h1 class="title">TourApp</h1>
            <ul class="nav-links">
                <li><a href="../contact/contact.html">Kontakt</a></li>
                <li><a href="tours.html">Ture</a></li>
                <li><a href="../restaurant/restaurant.html">Restorani</a></li>
            </ul>
        </nav>
    <div class="main">
        <div id="contact-info">
            <h2>Ture</h2>
            <div class="tours-table">
                  <table id="tours">
                    <thead>
                       <tr>
                          <th>Naziv</th>
                          <th>Duzina(km)</th>
                          
                      </tr>
                    </thead>
                    <tbody id="tours-body"> 
                    </tbody>
                  </table>
            </div>
            <div class="tour-details"></div> 
        </div> 
    
               
            <div class="Form">
                

              <form id="AddTourForm">
    
                    <label for="naziv">Naziv:</label>
                    <input type="text" id="naziv" name="naziv" required>
                    <br>
                    <label for="duzina">Duzina(km):</label>
                    <input type="number" id="duzina" name="duzina" required>
                    <br>
                    <label for="opis">Opis:</label>
                    <input type="text" id="opis" name="opis">
                    <br>
                    <label for="tagovi">Tagovi:</label>
                    <input type="text" id="tagovi">
                    <button type="button" id="dodajTag">+</button>

                    <div id="listaTagova"></div>
                    <br>
                </form> 
                <button type="button" id="submitBtn">Dodaj</button>
        </div>
    </div>
    <script src="tours.js"></script>
    </body>
</html>
